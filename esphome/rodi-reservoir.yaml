# RODI top-off reservoir level monitor
#
# Hardware
#   - ESP32-S3 dev board
#   - 350mm reed float sender, measured ~33 Ohm with the float at the top
#     (full) and ~241 Ohm at the bottom (empty). Not the 0-190 Ohm in the
#     listing. Mounted with hardware/rodi-rim-mount.scad in a 5-gal bucket,
#     rod tip ~1" off the floor.
#
# Wiring (voltage divider, sender on the ground side):
#
#   3V3 ── 220Ω 1% ──┬── GPIO4 (ADC1)
#                    │
#                  sender (33-241Ω)
#                    │
#   GND ─────────────┴── (optional 0.1µF from GPIO4 to GND)
#
#   33Ω (full) -> ~0.43V, 241Ω (empty) -> ~1.72V. An open circuit (sender
#   unplugged) reads close to 3.3V and is reported as "Sender Fault".
#
# Before first use, see the CALIBRATION section below and README.md.

substitutions:
  name: rodi-reservoir
  friendly_name: RODI Reservoir
  adc_pin: GPIO4 # any ADC1 pin works on the S3 (GPIO1-GPIO10)
  series_resistor: 220Ω

  # Usable gallons when the float is at the top of its travel. Level is
  # reported as *usable* water: 0 gal means the ATO pump can't pull any more.
  # ESTIMATE from bucket geometry (hardware/calibration_estimate.py); set it
  # to the top calibration point after a fill test.
  usable_capacity_gal: "4.85"

  # Usage tracking. Drops smaller than the deadband are treated as float /
  # ADC noise. A rise bigger than the refill threshold is treated as a refill
  # and is never counted as usage.
  usage_deadband_gal: "0.03"
  refill_threshold_gal: "0.30"

  # Resistance above this means the sender is disconnected or broken. The
  # sender reads ~241Ω when empty, so keep this well above that.
  fault_resistance_ohm: "350"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Persist the lifetime usage counter. A long interval saves flash wear; at
# worst a power cut loses a few minutes of usage.
preferences:
  flash_write_interval: 10min

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# Standalone web UI and REST/SSE API at http://rodi-reservoir.local/
# Works without Home Assistant, so a phone app or page can read it directly.
web_server:
  port: 80
  version: 3
  # Uncomment to require a login.
  # auth:
  #   username: !secret web_username
  #   password: !secret web_password

globals:
  # Lifetime gallons used (only ever goes up). Survives reboots.
  - id: used_total_gal
    type: float
    restore_value: true
    initial_value: "0.0"
  # Lowest level seen since the last refill; usage is measured against it.
  - id: usage_ref_gal
    type: float
    restore_value: false
    initial_value: "NAN"

sensor:
  # Raw divider voltage. Sampled every second and median-filtered so the
  # published value updates every 15s.
  - platform: adc
    id: sender_voltage
    name: Sender Voltage
    pin: ${adc_pin}
    attenuation: 12db
    samples: 8
    update_interval: 1s
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - median:
          window_size: 15
          send_every: 15
          send_first_at: 15

  # Sender resistance in ohms. Use this entity while calibrating.
  - platform: resistance
    id: sender_resistance
    name: Sender Resistance
    sensor: sender_voltage
    configuration: DOWNSTREAM
    resistor: ${series_resistor}
    reference_voltage: 3.3V
    accuracy_decimals: 1
    entity_category: diagnostic

  # Usable gallons in the reservoir.
  - platform: copy
    id: level_gal
    name: Level
    source_id: sender_resistance
    unit_of_measurement: gal
    device_class: volume_storage
    state_class: measurement
    icon: mdi:cup-water
    accuracy_decimals: 2
    filters:
      # Drop readings from a disconnected sender instead of reporting them.
      - lambda: |-
          if (std::isnan(x) || x > ${fault_resistance_ohm}) return {};
          return x;
      # ===================== CALIBRATION =====================
      # ESTIMATE from geometry, not a fill test yet. The sender is inverted:
      # low ohms = full. Points come from hardware/calibration_estimate.py
      # (float travel, bucket taper, 1" pump cutoff). "exact" interpolates
      # between points, which follows the taper. The float bottoms out with
      # ~0.3 gal still usable, so the level never reads lower than that.
      # Replace with fill-test points (README.md) when you can.
      - calibrate_linear:
          method: exact
          datapoints:
            # ESPHome requires the "from" (ohms) values in ascending order.
            # Ohms are what the ESP32 reports, not the multimeter: the ADC
            # reads the sender ~12% low (212 Ohm at the bottom stop vs 241
            # on the meter, 2026-11-09), so the geometry estimate is scaled
            # by 212.1/241.
            - 29.0 -> 4.85 # float on top stop (~13.3" of water)
            - 59.6 -> 4.05
            - 90.0 -> 3.26
            - 120.6 -> 2.49
            - 151.1 -> 1.74
            - 181.6 -> 1.01
            - 212.1 -> 0.30 # float on bottom stop (~1.8" of water)
      # =======================================================
      - clamp:
          min_value: 0
          max_value: ${usable_capacity_gal}
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            if (std::isnan(id(usage_ref_gal))) {
              id(usage_ref_gal) = x;
              return;
            }
            const float drop = id(usage_ref_gal) - x;
            if (drop >= ${usage_deadband_gal}) {
              id(used_total_gal) += drop;
              id(usage_ref_gal) = x;
              id(water_used).publish_state(id(used_total_gal));
            } else if (-drop >= ${refill_threshold_gal}) {
              ESP_LOGI("reservoir", "Refill detected: %.2f -> %.2f gal", id(usage_ref_gal), x);
              id(usage_ref_gal) = x;
            }

  - platform: copy
    id: level_percent
    name: Level Percent
    source_id: level_gal
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:water-percent
    accuracy_decimals: 0
    filters:
      - lambda: return x / ${usable_capacity_gal} * 100.0;

  # Lifetime usage counter for Home Assistant's utility_meter (usage/day).
  - platform: template
    id: water_used
    name: Water Used
    unit_of_measurement: gal
    device_class: water
    state_class: total_increasing
    icon: mdi:water-minus
    accuracy_decimals: 2
    update_interval: 5min
    lambda: return id(used_total_gal);

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

  # On when the sender reads open circuit (unplugged, broken wire, bad reed).
  - platform: template
    id: sender_fault
    name: Sender Fault
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      if (!id(sender_resistance).has_state()) return {};
      return std::isnan(id(sender_resistance).state) ||
             id(sender_resistance).state > ${fault_resistance_ohm};

button:
  - platform: restart
    name: Restart
    entity_category: config

  # Zero the lifetime usage counter, e.g. after testing the float by hand.
  # Home Assistant's utility_meter treats the drop to 0 as a meter reset.
  - platform: template
    name: Reset Water Used
    icon: mdi:counter
    entity_category: config
    on_press:
      - lambda: |-
          id(used_total_gal) = 0.0f;
          id(usage_ref_gal) = id(level_gal).has_state() ? id(level_gal).state : NAN;
          id(water_used).publish_state(0.0f);
          ESP_LOGI("reservoir", "Water Used reset to 0");
