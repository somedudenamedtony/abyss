# RODI reservoir: usage tracking and alerts.
#
# Install: copy this file to <config>/packages/ and make sure
# configuration.yaml has:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Expects the ESPHome device "rodi-reservoir" (friendly name "RODI Reservoir"),
# which creates:
#   sensor.rodi_reservoir_level           usable gallons
#   sensor.rodi_reservoir_level_percent
#   sensor.rodi_reservoir_water_used      lifetime gallons used (total_increasing)
#   binary_sensor.rodi_reservoir_sender_fault
#
# Alerts go through script.rodi_reservoir_notify. Change the notify service
# there (e.g. notify.mobile_app_tonys_phone) to send to your phone.

input_number:
  rodi_reservoir_low_gal:
    name: RODI Reservoir low alert
    unit_of_measurement: gal
    min: 0
    max: 4
    step: 0.1
    initial: 1.0
    mode: box
    icon: mdi:water-alert
  rodi_reservoir_critical_gal:
    name: RODI Reservoir critical alert
    unit_of_measurement: gal
    min: 0
    max: 2
    step: 0.1
    initial: 0.4
    mode: box
    icon: mdi:water-off
  # More than this used in one hour is almost certainly not evaporation:
  # a stuck ATO, a siphon, or a leak.
  rodi_reservoir_runaway_gal_per_hour:
    name: RODI Reservoir runaway alert
    unit_of_measurement: gal
    min: 0.1
    max: 5
    step: 0.1
    initial: 0.5
    mode: box
    icon: mdi:pipe-leak

utility_meter:
  rodi_reservoir_usage_daily:
    name: RODI Reservoir usage today
    unique_id: rodi_reservoir_usage_daily
    source: sensor.rodi_reservoir_water_used
    cycle: daily
    # The counter can step back slightly after a power cut. Ignore that
    # instead of treating it as a meter reset.
    periodically_resetting: false
  rodi_reservoir_usage_weekly:
    name: RODI Reservoir usage this week
    unique_id: rodi_reservoir_usage_weekly
    source: sensor.rodi_reservoir_water_used
    cycle: weekly
    periodically_resetting: false

sensor:
  - platform: statistics
    name: RODI Reservoir usage last 7 days
    unique_id: rodi_reservoir_usage_last_7_days
    entity_id: sensor.rodi_reservoir_water_used
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 10000
    precision: 2

  - platform: statistics
    name: RODI Reservoir usage last hour
    unique_id: rodi_reservoir_usage_last_hour
    entity_id: sensor.rodi_reservoir_water_used
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 500
    precision: 2

template:
  - sensor:
      - name: RODI Reservoir average daily usage
        unique_id: rodi_reservoir_average_daily_usage
        unit_of_measurement: gal
        state_class: measurement
        icon: mdi:chart-line
        availability: "{{ has_value('sensor.rodi_reservoir_usage_last_7_days') }}"
        state: >
          {{ (states('sensor.rodi_reservoir_usage_last_7_days') | float(0) / 7) | round(2) }}

      - name: RODI Reservoir days remaining
        unique_id: rodi_reservoir_days_remaining
        unit_of_measurement: d
        state_class: measurement
        icon: mdi:calendar-clock
        availability: >
          {{ has_value('sensor.rodi_reservoir_level')
             and states('sensor.rodi_reservoir_average_daily_usage') | float(0) > 0.01 }}
        state: >
          {{ (states('sensor.rodi_reservoir_level') | float(0)
              / states('sensor.rodi_reservoir_average_daily_usage') | float(1)) | round(1) }}

script:
  rodi_reservoir_notify:
    alias: RODI Reservoir notify
    mode: queued
    fields:
      title:
        description: Notification title
      message:
        description: Notification body
    sequence:
      # TODO: change to your phone, e.g. notify.mobile_app_tonys_phone
      - action: notify.notify
        data:
          title: "{{ title }}"
          message: "{{ message }}"

automation:
  - id: rodi_reservoir_low
    alias: RODI Reservoir low
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.rodi_reservoir_level
        below: input_number.rodi_reservoir_low_gal
        for: "00:05:00"
      # Daily nag while it stays low.
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: numeric_state
        entity_id: sensor.rodi_reservoir_level
        below: input_number.rodi_reservoir_low_gal
      - condition: numeric_state
        entity_id: sensor.rodi_reservoir_level
        above: input_number.rodi_reservoir_critical_gal
    actions:
      - action: script.rodi_reservoir_notify
        data:
          title: RODI reservoir low
          message: >
            {{ states('sensor.rodi_reservoir_level') }} gal left
            ({{ states('sensor.rodi_reservoir_level_percent') }}%).
            {% if has_value('sensor.rodi_reservoir_days_remaining') %}
            About {{ states('sensor.rodi_reservoir_days_remaining') }} days at the current rate.
            {% endif %}

  - id: rodi_reservoir_critical
    alias: RODI Reservoir critical
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.rodi_reservoir_level
        below: input_number.rodi_reservoir_critical_gal
        for: "00:05:00"
      - trigger: time_pattern
        hours: "/4"
    conditions:
      - condition: numeric_state
        entity_id: sensor.rodi_reservoir_level
        below: input_number.rodi_reservoir_critical_gal
    actions:
      - action: script.rodi_reservoir_notify
        data:
          title: RODI reservoir almost empty
          message: >
            Only {{ states('sensor.rodi_reservoir_level') }} gal left.
            Refill now or the ATO will run dry.

  - id: rodi_reservoir_runaway
    alias: RODI Reservoir runaway usage
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.rodi_reservoir_usage_last_hour
        above: input_number.rodi_reservoir_runaway_gal_per_hour
    actions:
      - action: script.rodi_reservoir_notify
        data:
          title: RODI reservoir draining fast
          message: >
            {{ states('sensor.rodi_reservoir_usage_last_hour') }} gal used in the last hour.
            Check the ATO for a stuck pump, siphon, or leak.

  - id: rodi_reservoir_sensor_problem
    alias: RODI Reservoir sensor problem
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.rodi_reservoir_sender_fault
        to: "on"
        for: "00:02:00"
        id: fault
      - trigger: state
        entity_id: sensor.rodi_reservoir_level
        to: unavailable
        for: "00:15:00"
        id: offline
    actions:
      - action: script.rodi_reservoir_notify
        data:
          title: RODI reservoir monitor problem
          message: >
            {% if trigger.id == 'fault' %}
            The float sender reads open circuit. Check the wiring.
            {% else %}
            The level monitor has been offline for 15 minutes.
            {% endif %}
